limit_req_zone $binary_remote_addr zone=stampfel_counters:1m rate=5r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/counters {
        limit_req zone=stampfel_counters burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $counter_upstream http://counters:8090;
        proxy_pass $counter_upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
