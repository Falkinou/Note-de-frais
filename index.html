<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stampfel">
<meta name="theme-color" content="#13120f">
<meta name="application-version" content="1.11.1">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Stampfel</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#110a04}
body{font-family:'Instrument Sans',sans-serif;color:#f0f0f0;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) translateX(-50%) scale(.95)}to{opacity:1;transform:translateY(0) translateX(-50%) scale(1)}}
@keyframes popIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:#12110f}
.glass{background:rgba(255,255,255,.03);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.glass-btn{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-control);color:rgba(255,255,255,.95);padding:16px 24px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:all .25s ease;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.glass-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);box-shadow:0 0 20px rgba(255,255,255,.04)}
.glass-btn:active{transform:scale(.97);background:rgba(255,255,255,.1)}
.primary-btn{background:rgba(189,128,87,.1);border:1px solid rgba(189,128,87,.15);border-radius:var(--radius-control);color:#edb28b;padding:18px 28px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:all .25s ease;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;letter-spacing:.01em;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.primary-btn:hover{background:rgba(189,128,87,.18);border-color:rgba(189,128,87,.25);box-shadow:0 0 24px rgba(189,128,87,.1)}
.primary-btn:active{transform:scale(.97)}.primary-btn:disabled{opacity:.5}
.sec-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-control);color:#fff;padding:14px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:all .25s ease;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.sec-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.15);box-shadow:0 0 16px rgba(255,255,255,.03)}
.sec-btn:active{transform:scale(.97)}
.cdot{border-radius:50%;cursor:pointer;transition:all .2s;border:3px solid transparent;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.cdot:active{transform:scale(1.1)}
.shape-btn{flex:1;padding:12px;border-radius:var(--radius-control);border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.shape-btn.active{border-color:var(--copper);background:rgba(189,128,87,.15);box-shadow:0 0 16px rgba(189,128,87,.25)}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:5px;background:rgba(255,255,255,.12);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--copper);box-shadow:0 2px 10px rgba(189,128,87,.5);cursor:pointer}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(189,128,87,.9);color:#0e0e10;padding:12px 28px;border-radius:var(--radius-control);font-weight:600;font-size:14px;animation:toastIn .3s ease;z-index:999;box-shadow:0 8px 30px rgba(189,128,87,.25);backdrop-filter:blur(12px);font-family:'Instrument Sans',sans-serif;white-space:nowrap;display:none}
.tog{width:50px;height:28px;border-radius:var(--radius-control);border:none;cursor:pointer;position:relative;transition:background .3s;flex-shrink:0}
.tog .dot{width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tog.on{background:var(--copper);box-shadow:0 0 14px rgba(189,128,87,.4)}.tog.on .dot{left:25px}
.tog.off{background:rgba(255,255,255,.1);box-shadow:none}.tog.off .dot{left:3px}
.lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.hdr{padding:16px 20px;padding-top:max(16px,env(safe-area-inset-top,16px));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04);background:rgba(18,17,15,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:50}
.htitle{font-size:17px;font-weight:700;background:none;color:var(--copper);-webkit-text-fill-color:currentColor}
.scr{flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;min-height:0}
textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-control);color:#f0f0f0;padding:12px 14px;font-size:14px;font-family:'Instrument Sans',sans-serif;line-height:1.6;resize:none;outline:none;box-sizing:border-box}
.blob1{position:fixed;top:-80px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(189,128,87,.07),transparent 65%);pointer-events:none}
.blob2{position:fixed;bottom:80px;left:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(189,128,87,.04),transparent 65%);pointer-events:none}
.blob3{display:none}
.grdt{background:none;color:var(--copper);-webkit-text-fill-color:currentColor}
.pinch-hint{font-size:12px;color:rgba(255,255,255,.95);margin-top:12px;text-align:center;line-height:1.5}
.crop-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.crop-handle{position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(189,128,87,.9);border:2px solid #fff;pointer-events:all;cursor:move;z-index:20;transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.5);touch-action:none}
.crop-dim{position:absolute;background:rgba(0,0,0,.55)}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app"></div>
<canvas id="cv" style="display:none"></canvas>
<canvas id="cv2" style="display:none"></canvas>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="receipt.js" defer></script>
<script src="stamp-renderer.js" defer></script>
<script src="reading.js" defer></script>
<script src="ocr.js" defer></script>
<script src="export-file.js" defer></script>
<script src="counters.js" defer></script>
<script src="pdf-import.js" defer></script>
<script src="pdf-export.js" defer></script>
<script src="local-store.js" defer></script>
<script src="receipt-viewer.js" defer></script>
<script src="image-processing.js" defer></script>
<script src="image-tools.js" defer></script>
<script src="offline.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
