<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#110a04}
body{font-family:'Outfit',sans-serif;color:#f0f0f0;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) translateX(-50%) scale(.95)}to{opacity:1;transform:translateY(0) translateX(-50%) scale(1)}}
@keyframes popIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:#12110f}
.glass{background:rgba(255,255,255,.03);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.06);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.glass-btn{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:16px;color:rgba(255,255,255,.95);padding:16px 24px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Instrument Sans','Outfit',sans-serif;transition:all .25s ease;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.glass-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);box-shadow:0 0 20px rgba(255,255,255,.04)}
.glass-btn:active{transform:scale(.97);background:rgba(255,255,255,.1)}
.primary-btn{background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.15);border-radius:16px;color:rgb(251,186,120);padding:18px 28px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Instrument Sans','Outfit',sans-serif;transition:all .25s ease;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;letter-spacing:.01em;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.primary-btn:hover{background:rgba(251,146,60,.18);border-color:rgba(251,146,60,.25);box-shadow:0 0 24px rgba(251,146,60,.1)}
.primary-btn:active{transform:scale(.97)}.primary-btn:disabled{opacity:.5}
.sec-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;color:#fff;padding:14px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .25s ease;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.sec-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.15);box-shadow:0 0 16px rgba(255,255,255,.03)}
.sec-btn:active{transform:scale(.97)}
.cdot{border-radius:50%;cursor:pointer;transition:all .2s;border:3px solid transparent;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.cdot:active{transform:scale(1.1)}
.shape-btn{flex:1;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.shape-btn.active{border-color:#f97316;background:rgba(249,115,22,.15);box-shadow:0 0 16px rgba(249,115,22,.25)}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:5px;background:rgba(255,255,255,.12);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f97316,#f43f5e);box-shadow:0 2px 10px rgba(249,115,22,.5);cursor:pointer}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(251,146,60,.9);color:#0e0e10;padding:12px 28px;border-radius:14px;font-weight:600;font-size:14px;animation:toastIn .3s ease;z-index:999;box-shadow:0 8px 30px rgba(251,146,60,.25);backdrop-filter:blur(12px);font-family:'Instrument Sans','Outfit',sans-serif;white-space:nowrap;display:none}
.tog{width:50px;height:28px;border-radius:14px;border:none;cursor:pointer;position:relative;transition:background .3s;flex-shrink:0}
.tog .dot{width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tog.on{background:linear-gradient(135deg,#f97316,#f43f5e);box-shadow:0 0 14px rgba(249,115,22,.4)}.tog.on .dot{left:25px}
.tog.off{background:rgba(255,255,255,.1);box-shadow:none}.tog.off .dot{left:3px}
.lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.hdr{padding:16px 20px;padding-top:max(16px,env(safe-area-inset-top,16px));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04);background:rgba(18,17,15,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:50}
.htitle{font-size:17px;font-weight:700;background:linear-gradient(135deg,#fdba74,#fb923c,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.scr{flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;min-height:0}
textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#f0f0f0;padding:12px 14px;font-size:14px;font-family:'Outfit',sans-serif;line-height:1.6;resize:none;outline:none;box-sizing:border-box}
.blob1{position:fixed;top:-80px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.07),transparent 65%);pointer-events:none}
.blob2{position:fixed;bottom:80px;left:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.04),transparent 65%);pointer-events:none}
.blob3{display:none}
.grdt{background:linear-gradient(135deg,#fdba74,#fb923c,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

// Smart stamp positioning: analyze image to find the emptiest zone
function findBestPosition(imgSrc,callback){
  var im2=new Image();
  im2.onload=function(){
    var cv2=document.getElementById("cv2"),cx2=cv2.getContext("2d");
    // Downscale for fast analysis
    var aw=Math.min(im2.width,200),ah=Math.round(aw*im2.height/im2.width);
    cv2.width=aw;cv2.height=ah;
    cx2.drawImage(im2,0,0,aw,ah);
    var id=cx2.getImageData(0,0,aw,ah),d=id.data;

    // Convert to grayscale
    var gray=new Float32Array(aw*ah);
    for(var i=0;i<aw*ah;i++)gray[i]=d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114;

    // Compute variance in blocks (lower variance = emptier area)
    // Stamp is roughly 40% width, 15% height
    var bw=Math.round(aw*0.35),bh=Math.round(ah*0.12);
    var bestX=50,bestY=75,bestScore=Infinity;
    var stepX=Math.max(2,Math.round(aw/20)),stepY=Math.max(2,Math.round(ah/20));

    for(var by=bh;by<ah-bh;by+=stepY){
      for(var bx=Math.round(bw/2);bx<aw-Math.round(bw/2);bx+=stepX){
        var sum=0,sum2=0,count=0;
        var x0=bx-Math.round(bw/2),y0=by-Math.round(bh/2);
        for(var yy=y0;yy<y0+bh&&yy<ah;yy++){
          for(var xx=x0;xx<x0+bw&&xx<aw;xx++){
            var v=gray[yy*aw+xx];
            sum+=v;sum2+=v*v;count++;
          }
        }
        if(count<10)continue;
        var mean=sum/count;
        var variance=(sum2/count)-(mean*mean);

        // Bonus: prefer bottom half (more natural), avoid very top
        var yPenalty=by<ah*0.15?500:0;
        var yBonus=by>ah*0.5?-variance*0.1:0;

        var score=variance+yPenalty+yBonus;
        if(score<bestScore){bestScore=score;bestX=(bx/aw)*100;bestY=(by/ah)*100}
      }
    }

    callback({x:Math.round(bestX),y:Math.round(bestY)});
  };
  im2.src=imgSrc;
}

function setupCrop(){
  var box=document.getElementById("cropBox"),ov=document.getElementById("cropOverlay");
  if(!box||!ov)return;
  drawCropUI();

  function getPos(e){
    var rect=box.getBoundingClientRect();
    var cx=e.clientX||((e.touches&&e.touches[0])?e.touches[0].clientX:0);
    var cy=e.clientY||((e.touches&&e.touches[0])?e.touches[0].clientY:0);
    return{x:Math.max(0,Math.min(100,((cx-rect.left)/rect.width)*100)),y:Math.max(0,Math.min(100,((cy-rect.top)/rect.height)*100))}
  }

  ov.addEventListener("pointerdown",function(e){
    var t=e.target;if(!t.dataset||!t.dataset.corner)return;
    e.preventDefault();e.stopPropagation();
    cropDrag=t.dataset.corner;
    t.setPointerCapture(e.pointerId);
  });
  ov.addEventListener("pointermove",function(e){
    if(!cropDrag)return;
    e.preventDefault();
    var p=getPos(e);
    if(cropDrag==="tl"){crop.x1=Math.min(p.x,crop.x2-8);crop.y1=Math.min(p.y,crop.y2-8)}
    else if(cropDrag==="tr"){crop.x2=Math.max(p.x,crop.x1+8);crop.y1=Math.min(p.y,crop.y2-8)}
    else if(cropDrag==="bl"){crop.x1=Math.min(p.x,crop.x2-8);crop.y2=Math.max(p.y,crop.y1+8)}
    else if(cropDrag==="br"){crop.x2=Math.max(p.x,crop.x1+8);crop.y2=Math.max(p.y,crop.y1+8)}
    drawCropUI();
  });
  ov.addEventListener("pointerup",function(){cropDrag=null});
  ov.addEventListener("pointercancel",function(){cropDrag=null});
}

function drawCropUI(){
  var ov=document.getElementById("cropOverlay");if(!ov)return;
  var x1=crop.x1,y1=crop.y1,x2=crop.x2,y2=crop.y2;
  var h='';
  // Dim regions
  h+='<div class="crop-dim" style="top:0;left:0;right:0;height:'+y1+'%"></div>';
  h+='<div class="crop-dim" style="bottom:0;left:0;right:0;height:'+(100-y2)+'%"></div>';
  h+='<div class="crop-dim" style="top:'+y1+'%;left:0;width:'+x1+'%;height:'+(y2-y1)+'%"></div>';
  h+='<div class="crop-dim" style="top:'+y1+'%;right:0;width:'+(100-x2)+'%;height:'+(y2-y1)+'%"></div>';
  // Border
  h+='<div style="position:absolute;left:'+x1+'%;top:'+y1+'%;width:'+(x2-x1)+'%;height:'+(y2-y1)+'%;border:2px solid rgba(249,115,22,.8);pointer-events:none;border-radius:4px"></div>';
  // Handles
  h+='<div class="crop-handle" data-corner="tl" style="left:'+x1+'%;top:'+y1+'%"></div>';
  h+='<div class="crop-handle" data-corner="tr" style="left:'+x2+'%;top:'+y1+'%"></div>';
  h+='<div class="crop-handle" data-corner="bl" style="left:'+x1+'%;top:'+y2+'%"></div>';
  h+='<div class="crop-handle" data-corner="br" style="left:'+x2+'%;top:'+y2+'%"></div>';
  ov.innerHTML=h;
}

// Auto-detect ticket borders and set crop handles
window._autoCrop=function(){
  toast("Détection en cours...");
  var im=new Image();
  im.onload=function(){
    var cv2=document.getElementById("cv2"),cx=cv2.getContext("2d");
    var aw=Math.min(im.width,300),ah=Math.round(aw*im.height/im.width);
    cv2.width=aw;cv2.height=ah;
    cx.drawImage(im,0,0,aw,ah);
    var id=cx.getImageData(0,0,aw,ah),d=id.data;
    // Convert to grayscale and find edges via Sobel-like gradient
    var gray=new Float32Array(aw*ah);
    for(var i=0;i<aw*ah;i++)gray[i]=d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114;
    // Find edges using gradient magnitude
    var edges=new Float32Array(aw*ah);
    for(var y=1;y<ah-1;y++){
      for(var x=1;x<aw-1;x++){
        var gx=gray[(y-1)*aw+x+1]-gray[(y-1)*aw+x-1]+2*(gray[y*aw+x+1]-gray[y*aw+x-1])+gray[(y+1)*aw+x+1]-gray[(y+1)*aw+x-1];
        var gy=gray[(y+1)*aw+x-1]-gray[(y-1)*aw+x-1]+2*(gray[(y+1)*aw+x]-gray[(y-1)*aw+x])+gray[(y+1)*aw+x+1]-gray[(y-1)*aw+x+1];
        edges[y*aw+x]=Math.sqrt(gx*gx+gy*gy);
      }
    }
    // Find bounding box of strong edges (ticket area)
    var thresh=40,minX=aw,maxX=0,minY=ah,maxY=0,found=false;
    for(var y2=2;y2<ah-2;y2++){
      for(var x2=2;x2<aw-2;x2++){
        if(edges[y2*aw+x2]>thresh){
          if(x2<minX)minX=x2;if(x2>maxX)maxX=x2;
          if(y2<minY)minY=y2;if(y2>maxY)maxY=y2;
          found=true;
        }
      }
    }
    if(found&&(maxX-minX)>aw*0.15&&(maxY-minY)>ah*0.15){
      // Add small margin
      var mx=aw*0.02,my=ah*0.02;
      crop.x1=Math.max(0,((minX-mx)/aw)*100);
      crop.y1=Math.max(0,((minY-my)/ah)*100);
      crop.x2=Math.min(100,((maxX+mx)/aw)*100);
      crop.y2=Math.min(100,((maxY+my)/ah)*100);
      drawCropUI();
      toast("Ticket détecté ✓");
    }else{
      toast("Détection impossible — ajustez manuellement");
    }
  };
  im.src=imgFull;
};

// ── DRAG + PINCH ──
function setupDragAndPinch(){
  var sd=document.getElementById("sd"),ic=document.getElementById("ic");
  if(!sd||!ic)return;
  sd.addEventListener("pointerdown",function(e){
    e.preventDefault();e.stopPropagation();
    var r=ic.getBoundingClientRect();
    doff={x:e.clientX-r.left-(r.width*sp.x)/100,y:e.clientY-r.top-(r.height*sp.y)/100};
    drag=true;sd.style.cursor="grabbing";
  });
  document.addEventListener("pointermove",function(e){
    if(!drag)return;var ic2=document.getElementById("ic");if(!ic2)return;
    var r=ic2.getBoundingClientRect();
    sp.x=Math.max(5,Math.min(95,((e.clientX-r.left-doff.x)/r.width)*100));
    sp.y=Math.max(5,Math.min(95,((e.clientY-r.top-doff.y)/r.height)*100));
    var sd2=document.getElementById("sd");if(sd2){sd2.style.left=sp.x+"%";sd2.style.top=sp.y+"%"}
  });
  document.addEventListener("pointerup",function(){if(drag){drag=false;savePos();var sd2=document.getElementById("sd");if(sd2)sd2.style.cursor="grab";if(navigator.vibrate)navigator.vibrate(15)}});
  ic.addEventListener("touchstart",function(e){
    if(e.touches.length===2){e.preventDefault();drag=false;
      var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
      pinchStartDist=Math.sqrt(dx*dx+dy*dy);pinchStartScale=S.scale;}
  },{passive:false});
  ic.addEventListener("touchmove",function(e){
    if(e.touches.length===2){e.preventDefault();
      var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx*dx+dy*dy),ratio=dist/pinchStartDist;
      S.scale=Math.max(0.3,Math.min(2.5,pinchStartScale*ratio));
      var sd2=document.getElementById("sd");if(sd2)sd2.style.transform="translate(-50%,-50%) scale("+S.scale+")";}
  },{passive:false});
  ic.addEventListener("touchend",function(e){if(e.touches.length<2&&pinchStartDist>0){pinchStartDist=0;save()}});
}

var MAX_PX=1080;
function resizeTo1080(dataUrl,cb){
  var im=new Image();
  im.onload=function(){
    var w=im.width,h=im.height;
    if(w<=MAX_PX&&h<=MAX_PX){cb(dataUrl);return}
    var ratio=Math.min(MAX_PX/w,MAX_PX/h);
    var nw=Math.round(w*ratio),nh=Math.round(h*ratio);
    var cv2=document.getElementById("cv2");cv2.width=nw;cv2.height=nh;
    var cx=cv2.getContext("2d");cx.drawImage(im,0,0,nw,nh);
    cb(cv2.toDataURL("image/jpeg",0.92));
  };
  im.src=dataUrl;
}

function fileInput(capture){
  var i=document.createElement("input");i.type="file";i.accept="image/*";
  if(capture)i.setAttribute("capture","environment");
  i.style.position="fixed";i.style.left="-9999px";
  document.body.appendChild(i);
  i.addEventListener("change",function(e){
    var f=e.target&&e.target.files&&e.target.files[0];document.body.removeChild(i);if(!f)return;
    var rd=new FileReader();
    rd.onload=function(ev){
      resizeTo1080(ev.target.result,function(resized){
        imgFull=resized;img=imgFull;crop={x1:5,y1:5,x2:95,y2:95};scr="crop";render();
      });
    };
    rd.readAsDataURL(f);
  });
  setTimeout(function(){i.click()},100);
}

// ── REALISTIC STAMP RENDERER ──
function drawStampOnCanvas(cv,cx,imW,imH){
  var c=SC[S.colorIdx]||SC[0];
  var lines=S.address.split("\n").filter(Boolean);
  var ds=S.showDate?dateStr():null;if(ds)lines.push(ds);
  var sW=imW*0.4*S.scale,lH=sW*0.09,pd=lH*0.9;
  var sH=S.shape==="circle"?Math.max(sW,lines.length*lH+pd*2):lines.length*lH+pd*2;
  var sx=(imW*sp.x)/100-sW/2,sy=(imH*sp.y)/100-sH/2;
  var stampCx=sx+sW/2,stampCy=sy+sH/2;

  // Slight random rotation for hand-stamped feel
  var inkAngle=S.rotation||0;
  if(S.vintage)inkAngle+=(Math.random()-0.5)*4;

  cx.save();
  if(inkAngle){cx.translate(stampCx,stampCy);cx.rotate(inkAngle*Math.PI/180);cx.translate(-stampCx,-stampCy)}

  var inkAlpha=S.vintage?0.72:0.88;
  cx.globalAlpha=inkAlpha;
  cx.fillStyle=c.bg;cx.strokeStyle=c.bd;cx.lineWidth=Math.max(3,sW*0.012);

  if(!S.noBg){
    if(S.shape==="circle"){
      var ccx2=sx+sW/2,ccy2=sy+sH/2,rr=Math.max(sW,sH)/2;
      cx.beginPath();cx.arc(ccx2,ccy2,rr,0,Math.PI*2);cx.fill();cx.stroke();
    }else{
      var rr2=sW*0.035;cx.beginPath();cx.moveTo(sx+rr2,sy);cx.lineTo(sx+sW-rr2,sy);
      cx.quadraticCurveTo(sx+sW,sy,sx+sW,sy+rr2);cx.lineTo(sx+sW,sy+sH-rr2);
      cx.quadraticCurveTo(sx+sW,sy+sH,sx+sW-rr2,sy+sH);cx.lineTo(sx+rr2,sy+sH);
      cx.quadraticCurveTo(sx,sy+sH,sx,sy+sH-rr2);cx.lineTo(sx,sy+rr2);
      cx.quadraticCurveTo(sx,sy,sx+rr2,sy);cx.closePath();cx.fill();cx.stroke();
    }
    var ib=sW*0.025;
    cx.strokeStyle=S.vintage?"rgba(255,255,255,.08)":"rgba(255,255,255,.2)";cx.lineWidth=Math.max(1,sW*0.006);
    if(S.shape==="circle"){cx.beginPath();cx.arc(sx+sW/2,sy+sH/2,Math.max(sW,sH)/2-ib,0,Math.PI*2);cx.stroke()}
    else{cx.strokeRect(sx+ib,sy+ib,sW-ib*2,sH-ib*2)}
    if(S.vintage){cx.setLineDash([sW*0.02,sW*0.015]);cx.strokeStyle="rgba(255,255,255,.1)";cx.lineWidth=Math.max(1,sW*0.005);
      if(S.shape==="circle"){cx.beginPath();cx.arc(sx+sW/2,sy+sH/2,Math.max(sW,sH)/2-ib*2,0,Math.PI*2);cx.stroke()}
      else{cx.strokeRect(sx+ib*2,sy+ib*2,sW-ib*4,sH-ib*4)}cx.setLineDash([])}
  }

  // Text with ink variation
  var fnt=FONTS[S.fontIdx||0]||FONTS[0];
  var tc=S.textColor||c.tx,bw=S.bold?fnt.w:400,bw2=S.bold?fnt.w2:400;
  var fontFam=fnt.f;
  cx.fillStyle=tc;cx.textAlign="center";var fs=lH*0.78;

  if(S.shape==="circle"&&S.arcText&&lines.length>0){
    // Arc text for circle stamps
    var ccAx=sx+sW/2,ccAy=sy+sH/2,radius=Math.max(sW,sH)/2;
    // First line: arc on top
    cx.font=(S.bold?bw:bw2)+" "+fs+"px "+fontFam;
    var lineAlphaT=S.vintage?(0.6+Math.random()*0.3):1;
    cx.globalAlpha=lineAlphaT;
    var topText=lines[0];
    var topR=radius*0.72;
    cx.save();cx.translate(ccAx,ccAy);
    var topAngle=topText.length*fs*0.022;
    var startA=-Math.PI/2-topAngle/2;
    for(var ci=0;ci<topText.length;ci++){
      var charA=startA+ci*(topAngle/topText.length)+topAngle/(topText.length*2);
      cx.save();cx.rotate(charA);cx.translate(0,-topR);cx.rotate(Math.PI/2);
      cx.fillText(topText[ci],0,0);
      cx.restore();
    }
    cx.restore();
    // Middle lines: straight center
    for(var mi=1;mi<lines.length;mi++){
      var isD2=ds&&mi===lines.length-1;
      cx.font=isD2?"400 "+(fs*0.78)+"px "+fontFam:bw2+" "+(fs*0.85)+"px "+fontFam;
      var lineAlphaM=S.vintage?(0.6+Math.random()*0.3):(isD2?0.7:1);
      cx.globalAlpha=lineAlphaM;
      cx.fillText(lines[mi],ccAx,ccAy+(mi-lines.length/2+0.5)*lH*0.9);
    }
  }else{
    // Normal straight text
    for(var i=0;i<lines.length;i++){
      var isD=ds&&i===lines.length-1;
      cx.font=isD?"400 "+(fs*0.78)+"px "+fontFam:(i===0?bw:bw2)+" "+fs+"px "+fontFam;
      var lineAlpha=S.vintage?(0.6+Math.random()*0.3):(isD?0.7:1);
      cx.globalAlpha=lineAlpha;
      var offX=S.vintage?(Math.random()-0.5)*sW*0.01:0;
      var offY=S.vintage?(Math.random()-0.5)*lH*0.08:0;
      cx.fillText(lines[i],sx+sW/2+offX,sy+pd+(i+0.78)*lH+offY);
    }
  }
  cx.restore();

  // Pixel-level ink effects - only when there's a background (not noBg)
  if(S.vintage&&!S.noBg){
    var gx=Math.max(0,Math.floor(sx)),gy=Math.max(0,Math.floor(sy));
    var gw=Math.min(Math.ceil(sW),cv.width-gx),gh=Math.min(Math.ceil(sH),cv.height-gy);
    if(gw>0&&gh>0){
      var id=cx.getImageData(gx,gy,gw,gh);
      var dd=id.data;
      for(var k=0;k<dd.length;k+=4){
        var px=(k/4)%gw,py=Math.floor((k/4)/gw);
        var dcx2=(px-gw/2)/(gw/2),dcy2=(py-gh/2)/(gh/2);
        var dist=Math.sqrt(dcx2*dcx2+dcy2*dcy2);
        var pressureFade=Math.min(1,dist*0.3);
        var noise=(Math.random()-0.5)*25;
        var bleed=Math.random()<0.02?-30:0;
        var edgeFade=dist>0.85?(dist-0.85)*150:0;
        dd[k]+=noise+bleed;dd[k+1]+=noise+bleed;dd[k+2]+=noise+bleed;
        dd[k+3]=Math.max(0,dd[k+3]-edgeFade-pressureFade*10);
      }
      cx.putImageData(id,gx,gy);
    }
  }
  cx.globalAlpha=1;
}

// ── GENERATE ──
window._gen=function(){
  var btn=document.getElementById("dlb");
  if(btn){btn.disabled=true;btn.textContent="Génération..."}
  var im=new Image();
  im.onload=function(){
    var cv=document.getElementById("cv"),cx=cv.getContext("2d");
    cv.width=im.width;cv.height=im.height;cx.drawImage(im,0,0);
    drawStampOnCanvas(cv,cx,im.width,im.height);

    cv.toBlob(function(blob){
      var fn=fname();
      function done(m,ok){
        if(ok){incCount();if(navigator.vibrate)navigator.vibrate([20,50,20]);showSuccess();
          setTimeout(function(){
            var bar=document.getElementById("dlb");
            if(bar&&bar.parentNode&&!document.getElementById("postSaveWrap")){
              var wrap=document.createElement("div");wrap.id="postSaveWrap";
              wrap.style.cssText="display:flex;gap:8px;margin-top:8px";
              var bk=document.createElement("button");
              bk.className="sec-btn";
              bk.style.cssText="flex:1;padding:14px;font-size:13px";
              bk.innerHTML=ic("home",14)+" Menu";
              bk.onclick=function(){scr="home";render()};
              var np=document.createElement("button");
              np.className="primary-btn";
              np.style.cssText="flex:1;padding:14px;font-size:13px";
              np.innerHTML=ic("camera",14)+" Nouvelle photo";
              np.onclick=function(){window._cam()};
              wrap.appendChild(bk);wrap.appendChild(np);
              bar.parentNode.appendChild(wrap);
            }
          },400);
        }
        if(btn){btn.disabled=false;btn.innerHTML=ic('save',14)+" Sauvegarder l'image"}toast(m);
      }

      function fallbackDownload(){
        try{
          var url=URL.createObjectURL(blob);
          var a=document.createElement("a");
          a.href=url;a.download=fn;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){URL.revokeObjectURL(url)},5000);
          done(fn+" sauvegardé ✓",true);
        }catch(e2){
          // Last resort: open blob as image in new tab
          try{
            var reader=new FileReader();
            reader.onload=function(){
              var w=window.open("");
              if(w){w.document.write("<img src=\""+reader.result+"\" style=\"max-width:100%\"><p>Appuyez longuement sur l\'image pour la sauvegarder</p>");
                done("Appuyez longuement sur l'image pour sauvegarder",true);
              }else{done("Popup bloquée — autorisez les popups",false)}
            };
            reader.readAsDataURL(blob);
          }catch(e3){done("Erreur de sauvegarde",false)}
        }
      }

      // Save based on user preference
      if(saveMethod==="share"){
        try{
          if(navigator.share&&navigator.canShare){
            var file=new File([blob],fn,{type:"image/png"});
            if(navigator.canShare({files:[file]})){
              navigator.share({files:[file]}).then(function(){
                done(fn+" partagé ✓",true);
              }).catch(function(e){
                if(e.name==="AbortError"){
                  // User cancelled - still count it since file was generated
                  done("Partage annulé",true);
                }else{
                  fallbackDownload();
                }
              });
              return;
            }
          }
        }catch(e){}
      }
      fallbackDownload();
    },"image/png");
  };
  im.src=img;
};

// ── GENERATE PDF ──
window._genPDF=function(){
  var btn2=document.getElementById("dlbpdf");
  if(btn2){btn2.disabled=true;btn2.textContent="Génération PDF..."}

  // First generate the stamped image on canvas (same as _gen)
  var im=new Image();
  im.onload=function(){
    var cv=document.getElementById("cv"),cx=cv.getContext("2d");
    cv.width=im.width;cv.height=im.height;cx.drawImage(im,0,0);
    drawStampOnCanvas(cv,cx,im.width,im.height);

    // Get JPEG data for smaller PDF
    var jpgData=cv.toDataURL("image/jpeg",0.92);
    var jpgRaw=atob(jpgData.split(",")[1]);
    var jpgLen=jpgRaw.length;
    var jpgBytes=new Uint8Array(jpgLen);
    for(var j=0;j<jpgLen;j++)jpgBytes[j]=jpgRaw.charCodeAt(j);

    // PDF size proportional to image (72 DPI, max 595pt wide)
    var iw=cv.width,ih=cv.height;
    var maxW=595.28;
    var scale2=Math.min(maxW/iw,1);
    var pw=iw*scale2,ph=ih*scale2;
    var dw=pw,dh=ph;
    var ox=0,oy=0;

    var o=[];
    function addObj(s){o.push(s);return o.length}
    addObj("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj");
    addObj("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj");
    addObj("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw.toFixed(2)+" "+ph.toFixed(2)+"] /Contents 4 0 R /Resources << /XObject << /Img 5 0 R >> >> >>\nendobj");
    addObj("4 0 obj\n<< /Length "+(("q "+dw.toFixed(2)+" 0 0 "+dh.toFixed(2)+" "+ox.toFixed(2)+" "+oy.toFixed(2)+" cm /Img Do Q").length)+" >>\nstream\nq "+dw.toFixed(2)+" 0 0 "+dh.toFixed(2)+" "+ox.toFixed(2)+" "+oy.toFixed(2)+" cm /Img Do Q\nendstream\nendobj");
    addObj("5 0 obj\n<< /Type /XObject /Subtype /Image /Width "+iw+" /Height "+ih+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpgLen+" >>\nstream\n");

    // Build PDF bytes
    var header="%PDF-1.4\n";
    var parts=[header];
    var offsets=[];
    for(var p=0;p<o.length;p++){
      var pos=0;for(var q=0;q<parts.length;q++)pos+=(typeof parts[q]==="string")?parts[q].length:parts[q].length;
      offsets.push(pos);
      parts.push(o[p]);
      if(p===4){parts.push(jpgBytes);parts.push("\nendstream\nendobj\n")}else{parts.push("\n")}
    }
    var xrefPos=0;for(var q2=0;q2<parts.length;q2++)xrefPos+=(typeof parts[q2]==="string")?parts[q2].length:parts[q2].length;
    var xref="xref\n0 "+(o.length+1)+"\n0000000000 65535 f \n";
    for(var r2=0;r2<offsets.length;r2++){var os2=String(offsets[r2]);while(os2.length<10)os2="0"+os2;xref+=os2+" 00000 n \n"}
    xref+="trailer\n<< /Size "+(o.length+1)+" /Root 1 0 R >>\nstartxref\n"+xrefPos+"\n%%EOF";
    parts.push(xref);

    // Combine all parts into one Uint8Array
    var totalLen=0;for(var t=0;t<parts.length;t++)totalLen+=(typeof parts[t]==="string")?parts[t].length:parts[t].length;
    var pdfBuf=new Uint8Array(totalLen);
    var off=0;
    for(var t2=0;t2<parts.length;t2++){
      if(typeof parts[t2]==="string"){for(var c2=0;c2<parts[t2].length;c2++){pdfBuf[off++]=parts[t2].charCodeAt(c2)}}
      else{pdfBuf.set(parts[t2],off);off+=parts[t2].length}
    }

    var pdfBlob=new Blob([pdfBuf],{type:"application/pdf"});
    var pdfName=fname().replace(".png",".pdf");

    function donePDF(m,ok){
      if(ok){incCount();showSuccess();
        setTimeout(function(){
          var bar=document.getElementById("dlbpdf");
          if(bar&&bar.parentNode&&!document.getElementById("postSaveWrap")){
            var wrap=document.createElement("div");wrap.id="postSaveWrap";
            wrap.style.cssText="display:flex;gap:8px;margin-top:8px";
            var bk=document.createElement("button");bk.className="sec-btn";
            bk.style.cssText="flex:1;padding:14px;font-size:13px";bk.innerHTML=ic("home",14)+" Menu";
            bk.onclick=function(){scr="home";render()};
            var np=document.createElement("button");np.className="primary-btn";
            np.style.cssText="flex:1;padding:14px;font-size:13px";np.innerHTML=ic("camera",14)+" Nouvelle photo";
            np.onclick=function(){window._cam()};
            wrap.appendChild(bk);wrap.appendChild(np);bar.parentNode.appendChild(wrap);
          }
        },400);
      }
      if(btn2){btn2.disabled=false;btn2.innerHTML=ic("pdf",14)+" Exporter en PDF"}if(m)toast(m);
    }

    function fallbackPDF(){
      try{
        var url=URL.createObjectURL(pdfBlob);
        var a=document.createElement("a");a.href=url;a.download=pdfName;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url)},5000);
        donePDF(pdfName+" sauvegardé ✓",true);
      }catch(e){
        // Last resort: open PDF in new tab
        try{
          var url2=URL.createObjectURL(pdfBlob);
          window.open(url2,"_blank");
          donePDF("PDF ouvert — sauvegardez depuis le navigateur",true);
        }catch(e2){donePDF("Erreur PDF",false)}
      }
    }

    // Save based on user preference
    if(saveMethod==="share"){
      try{
        if(navigator.share&&navigator.canShare){
          var pdfFile=new File([pdfBlob],pdfName,{type:"application/pdf"});
          if(navigator.canShare({files:[pdfFile]})){
            navigator.share({files:[pdfFile]}).then(function(){
              donePDF(pdfName+" partagé ✓",true);
            }).catch(function(e){
              if(e.name==="AbortError"){donePDF("Partage annulé",true)}
              else{fallbackPDF()}
            });
            return;
          }
        }
      }catch(e){}
    }
    fallbackPDF();
  };
  im.src=img;
};

// ── EXPRESS MODE ──
var expressMode=false;

window._express=function(){
  var i=document.createElement("input");i.type="file";i.accept="image/*";
  i.setAttribute("capture","environment");
  i.style.position="fixed";i.style.left="-9999px";
  document.body.appendChild(i);
  i.addEventListener("change",function(e){
    var f=e.target&&e.target.files&&e.target.files[0];document.body.removeChild(i);if(!f)return;
    toast("Mode rapide...");
    var rd=new FileReader();
    rd.onload=function(ev){
      resizeTo1080(ev.target.result,function(resized){
        img=resized;imgFull=img;
        S.scale=0.6;save();
        expressMode=true;
        findBestPosition(img,function(pos){
          sp=pos;scr="edit";render();
          toast("Vérifiez le placement puis sauvegardez");
        });
      });
    };
    rd.readAsDataURL(f);
  });

};

// Express auto-save: triggered from edit screen in express mode
window._expressSave=function(){
  var btn=document.getElementById("dlb");
  if(btn){btn.disabled=true;btn.textContent="Génération..."}
  var im=new Image();
  im.onload=function(){
    var cv=document.getElementById("cv"),cx=cv.getContext("2d");
    cv.width=im.width;cv.height=im.height;cx.drawImage(im,0,0);
    drawStampOnCanvas(cv,cx,im.width,im.height);
    cv.toBlob(function(blob){
      var fn=fname();
      function expressDone(m){
        incCount();if(navigator.vibrate)navigator.vibrate([20,50,20]);
        showSuccess();toast(m);expressMode=false;
        setTimeout(function(){scr="home";render()},1800);
      }
      if(saveMethod==="share"){
        try{
          if(navigator.share&&navigator.canShare){
            var file=new File([blob],fn,{type:"image/png"});
            if(navigator.canShare({files:[file]})){
              navigator.share({files:[file]}).then(function(){
                expressDone(fn+" partagé ✓");
              }).catch(function(e){
                if(e.name==="AbortError"){expressDone("Partage annulé")}
                else{expressDownload(blob,fn,expressDone)}
              });return;
            }
          }
        }catch(e){}
      }
      expressDownload(blob,fn,expressDone);
    },"image/png");
  };
  im.src=img;
};

function expressDownload(blob,fn,cb){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download=fn;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},5000);
    cb(fn+" sauvegardé ✓");
  }catch(e){
    expressMode=false;
    toast("Erreur de sauvegarde");scr="home";render();
  }
}

// Toggle image enhancement (contrast + brightness + sharpness)
window._toggleEnhance=function(){
  if(imgEnhanced){
    // Restore original
    img=imgOriginal;imgEnhanced=false;render();toast("Image originale restaurée");return;
  }
  imgOriginal=img;
  toast("Amélioration...");
  var im=new Image();
  im.onload=function(){
    var cv2=document.getElementById("cv2"),cx=cv2.getContext("2d");
    cv2.width=im.width;cv2.height=im.height;
    // Apply contrast + brightness
    cx.filter="contrast(1.25) brightness(1.08) saturate(1.05)";
    cx.drawImage(im,0,0);
    cx.filter="none";
    // Simple unsharp mask for sharpness
    var id=cx.getImageData(0,0,im.width,im.height);
    var d=id.data,w=im.width,h=im.height;
    var orig=new Uint8ClampedArray(d);
    var amt=0.4; // sharpness amount
    for(var y=1;y<h-1;y++){
      for(var x=1;x<w-1;x++){
        var idx=(y*w+x)*4;
        for(var c2=0;c2<3;c2++){
          var blur=(orig[((y-1)*w+x)*4+c2]+orig[((y+1)*w+x)*4+c2]+orig[(y*w+x-1)*4+c2]+orig[(y*w+x+1)*4+c2])/4;
          d[idx+c2]=Math.min(255,Math.max(0,orig[idx+c2]+amt*(orig[idx+c2]-blur)));
        }
      }
    }
    cx.putImageData(id,0,0);
    img=cv2.toDataURL("image/jpeg",0.92);
    imgEnhanced=true;render();toast("Image améliorée ✓");
  };
  im.src=img;
};

  var swBlob=new Blob([swCode],{type:"application/javascript"});
